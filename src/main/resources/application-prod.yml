spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:patrimonio}
    username: ${POSTGRES_USER:patrimonio}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  servlet:
    session:
      cookie:
        # Produccion exige HTTPS: la cookie de sesion no viaja por HTTP.
        secure: true

patrimonio:
  api:
    cuentas:
      # Explicito: el endpoint no se expone en produccion sin autenticacion.
      expuesta: false

logging:
  level:
    org.hibernate.SQL: warn
