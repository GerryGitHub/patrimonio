spring:
  config:
    # En local, reutiliza el mismo .env que Docker Compose.
    # Es opcional: si no existe, se usan las variables de entorno del sistema.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:patrimonio}
    username: ${POSTGRES_USER:patrimonio}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
