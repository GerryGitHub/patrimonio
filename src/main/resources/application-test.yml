spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: 2

patrimonio:
  api:
    cuentas:
      # Las pruebas ejercitan el contrato HTTP completo.
      expuesta: true
    inversiones:
      # Las pruebas ejercitan el contrato HTTP completo.
      expuesta: true
